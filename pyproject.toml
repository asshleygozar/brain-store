[project]
name = "brain-store"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asshley Gozar", email = "164751126+asshleygozar@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.16",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
brain-store = "brain_store:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
