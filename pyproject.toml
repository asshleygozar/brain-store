[project]
name = "brain-store"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asshley Gozar", email = "164751126+asshleygozar@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-pinecone>=0.2.13",
    "pinecone[asyncio]>=7.3.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-magic>=0.4.27",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
