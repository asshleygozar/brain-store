name: Build, Publish to GHCR, and Deploy to

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Checkouts
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Login to Heroku
      - name: Login to Heroku
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: '_'
          password: ${{ secrets.HEROKU_API_KEY }}

      # Build and Push Both to GHCR and Heroku Container Registry
      - name: Build and Push Docker Image to GHCR and Heroku
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/brain-store-api:latest
            registry.heroku.com/brain-store-api/web

      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          curl https://cli-assets.heroku.com/install-ubuntu.sh | sh
          heroku container:release web --app brain-store-api
